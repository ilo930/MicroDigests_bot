<style>
/* Mascot 02, the original. She carries nothing and reacts to nothing: the
   cup drifts beside her on the right, the words arrive on her left, and she
   just sits there. She does not smile, and that is the joke. */
.mouse{position:relative;width:58px;z-index:2;order:1;
  shape-rendering:crispEdges;overflow:visible;
  animation:mouse-hop 2.4s steps(1) infinite}
.mouse .eye{animation:mouse-blink 3.6s steps(1) infinite;transform-origin:center}
.mouse .tail{animation:mouse-tail 1.9s steps(1) infinite}
/* At the end she tips over and speeds up. She leans AWAY from the bubble,
   which sits on her left, so she is not crowding the thing she just said. */
/* Her gaze follows the scroll: you, then the page on her left, then you
   again. One cell of travel is the whole range her eye whites allow. */
.mouse .gaze{transition:transform .55s cubic-bezier(.16,1,.3,1)}
.mouse .lean{transform-origin:9px 19px;
  transition:transform .45s cubic-bezier(.16,1,.3,1)}
.resupply.open .lean,.resupply:hover .lean{transform:rotate(8deg) translateX(1.2px)}
.dock.excited .mouse{animation-duration:.7s}
@keyframes mouse-hop{0%,44%{transform:translateY(0)}48%,64%{transform:translateY(-3px)}
  68%,100%{transform:translateY(0)}}
@keyframes mouse-blink{0%,42%{transform:scaleY(1)}43%,45%{transform:scaleY(.1)}
  46%,100%{transform:scaleY(1)}}
@keyframes mouse-tail{0%,49%{transform:rotate(0)}50%,100%{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){.mouse,.mouse *{animation:none!important}}
