<style>
/* The mascot. Big enough that its face clears the cup, tucked behind it. */
.mouse{position:absolute;left:0;bottom:20px;width:86px;z-index:0;
  shape-rendering:crispEdges;overflow:visible;
  animation:mouse-hop 2.4s steps(1) infinite}
.mouse .head{transform-origin:10px 13px;animation:mouse-nod 3.4s ease-in-out infinite}
.mouse .eye{animation:mouse-blink 3.6s steps(1) infinite;transform-origin:center}
/* It watches the page for a while, then turns and looks at you. */
.mouse .gaze{animation:mouse-gaze 7.5s ease-in-out infinite}
.mouse .tail{animation:mouse-tail 1.9s steps(1) infinite}
.mouse .happy,.mouse .tailheart{opacity:0;transition:opacity .25s}
.mouse .tailtip{transition:opacity .25s}
.mouse .eye{transition:opacity .25s}
/* And it smiles once the words arrive. */
.resupply.open .happy,.resupply:hover .happy,
.resupply.open .tailheart,.resupply:hover .tailheart{opacity:1}
.resupply.open .eye,.resupply:hover .eye,
.resupply.open .tailtip,.resupply:hover .tailtip{opacity:0}
.dock.excited .mouse{animation-duration:.7s}
.dock.excited .mouse .head{animation-duration:1.3s}
.dock.excited .mouse .tail{animation-duration:.9s}
.dock.excited .mouse .gaze{animation:none;transform:none}

@keyframes mouse-hop{0%,44%{transform:translateY(0)}48%,64%{transform:translateY(-3px)}
  68%,100%{transform:translateY(0)}}
@keyframes mouse-nod{0%,64%,100%{transform:rotate(0)}78%{transform:rotate(4deg)}90%{transform:rotate(-1deg)}}
@keyframes mouse-blink{0%,42%{transform:scaleY(1)}43%,45%{transform:scaleY(.1)}
  46%,100%{transform:scaleY(1)}}
@keyframes mouse-gaze{0%,30%{transform:translateX(-1.6px)}
  42%,92%{transform:translateX(0)}100%{transform:translateX(-1.6px)}}
@keyframes mouse-tail{0%,49%{transform:rotate(0)}50%,100%{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){.mouse,.mouse *{animation:none!important}}

</style>
